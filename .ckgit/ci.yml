# Build and publish the documentation on rpi4 without network access.
# Pin the ckdocs source so a tool update cannot silently change this site.
version: 1
on:
  branches: [main]
runs_on: primary
sisters:
  - name: ck-git-hosting
    ref: a04cdb5839f0d1d5e7e40c8ca72a693e81fec797
jobs:
  - name: documentation
    steps:
      - name: build-ckdocs
        script: |
          make -C ../ck-git-hosting -j2 BUILD_ROOT="$TMPDIR" BUILD_DIR="$TMPDIR/ckdocs" "$TMPDIR/ckdocs/bin/ckdocs"
          "$TMPDIR/ckdocs/bin/ckdocs" --version
      - name: validate-and-build-site
        script: |
          "$TMPDIR/ckdocs/bin/ckdocs" build --root "$PWD" --out "$PWD/public" --strict
    artifacts:
      name: documentation
      paths: [public]
pages:
  path: public
