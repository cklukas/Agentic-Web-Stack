# Build and publish the documentation on rpi4 without network access.
# Pin the ckdocs source so a tool update cannot silently change this site.
# ckdocs.yml's site.url is the public GitHub Pages address; --site-url
# points this host's llms.txt and Markdown links at the rpi4 copy instead.
version: 1
on:
  branches: [main]
runs_on: primary
sisters:
  - name: ck-git-hosting
    ref: ad6dc1de73cedef8eb64d53ab607043ae09845ee
jobs:
  - name: documentation
    steps:
      - name: build-ckdocs
        script: |
          make -C ../ck-git-hosting -j2 BUILD_ROOT="$TMPDIR" BUILD_DIR="$TMPDIR/ckdocs" "$TMPDIR/ckdocs/bin/ckdocs"
          "$TMPDIR/ckdocs/bin/ckdocs" --version
      - name: validate-and-build-site
        script: |
          "$TMPDIR/ckdocs/bin/ckdocs" build --root "$PWD" --site-url http://rpi4:8421/Agentic-Web-Stack/ --out "$PWD/public" --strict
    artifacts:
      name: documentation
      paths: [public]
pages:
  path: public
