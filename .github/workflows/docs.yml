name: Docs and Demo

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# ckdocs is installed from the pinned ck-git-hosting release's Debian package,
# which must match the SHA-256 recorded here. .ckgit/ci.yml builds the same
# release from source for the rpi4 Pages, so both hosts run ckdocs 0.8.1.
# The runner image is pinned rather than ubuntu-latest: that .deb is built
# for and exercised on Ubuntu 24.04, as in ckmux's Pages workflow.
env:
  CKDOCS_REPOSITORY: cklukas/ck-git-hosting
  CKDOCS_VERSION: 0.8.1
  CKDOCS_SHA256: 054a447ca09f9602e926fea186b68c1848a75f7c95904cbfe6b32f64b4aecfe6

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate specs
        run: npm run specs:validate

      - name: Test API demo
        run: npm run api:test

      - name: Smoke test local demo
        run: npm run demo:smoke

      - name: Install ckdocs
        run: |
          deb="$RUNNER_TEMP/ckdocs_${CKDOCS_VERSION}_amd64.deb"
          curl --fail --location --silent --show-error --retry 3 --output "$deb" \
            "https://github.com/$CKDOCS_REPOSITORY/releases/download/v$CKDOCS_VERSION/ckdocs_${CKDOCS_VERSION}_amd64.deb"
          echo "$CKDOCS_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg --install "$deb"
          ckdocs --version | grep -F "ckdocs $CKDOCS_VERSION"

      - name: Build ckdocs site
        run: ckdocs build --root "$PWD" --out "$RUNNER_TEMP/site" --strict

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
