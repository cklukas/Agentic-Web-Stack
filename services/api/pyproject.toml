[project]
name = "agentic-web-demo-api"
version = "0.1.0"
description = "Local runnable Literature Review Assistant demo for the Agentic Web Stack."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pyjwt>=2.9.0",
  "pyyaml>=6.0.2",
  "uvicorn[standard]>=0.30.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
